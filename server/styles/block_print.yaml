prompt: Recreate this photo as a hand-carved block print with bold cut lines, a few flat ink colors and
  uneven ink texture. Keep every person, face, pose and the overall composition recognizable.
negative_prompt: text, watermark, extra limbs, distorted faces
preview_prompt: A person standing outdoors in a park, face clearly visible, trees and sky in the background,
  as a hand-carved block print with bold cut lines and flat ink.
status_text: Carving the block…
