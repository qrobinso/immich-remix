id: instant_film_with_flash
name: Instant Film with Flash
category: photo_looks
media_types:
- image
default_provider:
  image: gemini
prompt: Give this photo the look of an instant film print taken with a direct flash, with a white frame,
  harsh flash, crushed shadows and soft color. Keep every person, face, pose and the overall composition
  recognizable.
negative_prompt: text, watermark, extra limbs, distorted faces
preview_prompt: A person standing outdoors in a park, face clearly visible, trees and sky in the background,
  as an instant film print with direct flash and a white border.
status_text: Developing the print…
