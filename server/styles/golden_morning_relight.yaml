id: golden_morning_relight
name: Golden Morning Relight
category: scenes
media_types:
- image
- video
default_provider:
  image: gemini
  video: runway
prompt: Relight this photo as a golden morning, with low warm sunlight, long soft shadows, a gentle haze
  and a cinematic glow. Keep every person, face, pose and the overall composition recognizable.
negative_prompt: text, watermark, extra limbs, distorted faces
preview_prompt: A person standing outdoors in a park, face clearly visible, trees and sky in the background,
  relit by warm golden morning sunlight with a cinematic glow.
status_text: Waiting for sunrise…
